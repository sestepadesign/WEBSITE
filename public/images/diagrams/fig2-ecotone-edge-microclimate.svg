<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background-color:#FAF8F5; font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="stoneHatch" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 0 M 0 0 L 20 20" fill="none" stroke="#D2C8B8" stroke-width="0.8" />
    </pattern>
    <pattern id="soilHatch" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#BAA898" />
      <circle cx="8" cy="8" r="1.2" fill="#8C7A6B" />
    </pattern>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4A5844" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4B779A" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C07D53" />
    </marker>
  </defs>

  <!-- Title & Header -->
  <text x="40" y="45" font-size="20" font-weight="600" fill="#2C302E" letter-spacing="0.5">FIG. 2: ARCHITECTURAL ECOTONE &amp; MICROCLIMATE CROSS-SECTION</text>
  <text x="40" y="70" font-size="13" font-style="italic" fill="#6E7271">Thermal Mass Storage, Desiccating Wind Deflection &amp; Bio-Retention Keyline</text>
  <line x1="40" y1="85" x2="960" y2="85" stroke="#DCD4C7" stroke-width="1.5" />

  <!-- Subsoil / Geology Layer -->
  <path d="M 40 440 L 960 440 L 960 520 L 40 520 Z" fill="#EAE2D8" />
  <path d="M 40 440 L 960 440 L 960 520 L 40 520 Z" fill="url(#soilHatch)" opacity="0.6" />
  <text x="60" y="490" font-size="12" font-weight="600" fill="#6E6053">Calcareous Bedrock / High pH Terra Rossa Substratum</text>

  <!-- Topsoil & Mulch Bed -->
  <path d="M 280 400 Q 420 395 560 415 T 760 425 Q 860 415 960 420 L 960 440 L 280 440 Z" fill="#7A6855" />
  <path d="M 280 395 Q 420 390 560 410 T 760 420 Q 860 410 960 415 L 960 422 L 280 402 Z" fill="#4B3A2C" />
  <text x="380" y="432" font-size="11" fill="#FAF8F5">Active Humus + Lignin Mulch Layer (8-10cm)</text>

  <!-- Hardscape: Traditional Mar?s Stone Wall -->
  <rect x="100" y="180" width="160" height="260" rx="2" fill="#E8DEC8" stroke="#B8A88E" stroke-width="1.5" />
  <rect x="100" y="180" width="160" height="260" fill="url(#stoneHatch)" />
  <!-- Stone joint lines -->
  <line x1="100" y1="230" x2="260" y2="230" stroke="#B8A88E" stroke-width="1.5" />
  <line x1="100" y1="280" x2="260" y2="280" stroke="#B8A88E" stroke-width="1.5" />
  <line x1="100" y1="330" x2="260" y2="330" stroke="#B8A88E" stroke-width="1.5" />
  <line x1="100" y1="380" x2="260" y2="380" stroke="#B8A88E" stroke-width="1.5" />
  <line x1="180" y1="180" x2="180" y2="230" stroke="#B8A88E" stroke-width="1.5" />
  <line x1="150" y1="230" x2="150" y2="280" stroke="#B8A88E" stroke-width="1.5" />
  <line x1="210" y1="280" x2="210" y2="330" stroke="#B8A88E" stroke-width="1.5" />
  <line x1="170" y1="330" x2="170" y2="380" stroke="#B8A88E" stroke-width="1.5" />

  <text x="115" y="210" font-size="13" font-weight="700" fill="#42382D">MAR?S STONE WALL</text>
  <text x="115" y="225" font-size="10.5" fill="#6A5A4A">Thermal Mass Core (50cm)</text>

  <!-- Paved terrace on the left -->
  <rect x="40" y="400" width="60" height="40" fill="#D6C7B2" stroke="#B09E86" stroke-width="1" />
  <line x1="40" y1="400" x2="100" y2="400" stroke="#8C7B65" stroke-width="2" />

  <!-- Botanical Elements (Vector representations) -->
  <!-- Aromatic Sub-shrub (Rosmarinus / Teucrium) -->
  <path d="M 320 395 C 300 340, 360 310, 380 340 C 400 300, 470 330, 450 395 Z" fill="#607358" stroke="#42533B" stroke-width="1.2" />
  <text x="330" y="365" font-size="11" font-weight="600" fill="#FAF8F5">Rosmarinus &amp; Teucrium</text>

  <!-- Specimen Tree (Olea europaea / Olivera) -->
  <path d="M 640 415 Q 630 300 590 250 Q 660 270 650 415" fill="#5A4838" stroke="#3D2F23" stroke-width="3" />
  <ellipse cx="600" cy="180" rx="130" ry="85" fill="#7C8F6E" fill-opacity="0.88" stroke="#526445" stroke-width="1.5" />
  <ellipse cx="580" cy="170" rx="100" ry="65" fill="#8CA07E" fill-opacity="0.9" />
  <text x="540" y="180" font-size="14" font-weight="700" fill="#283521">Olea europaea</text>
  <text x="530" y="198" font-size="11" fill="#3D4D34">Centenary Specimen Canopy</text>

  <!-- Swale / Infiltration Basin -->
  <path d="M 720 425 Q 770 445 820 425 Z" fill="#4B779A" fill-opacity="0.45" stroke="#3A6284" stroke-width="1" />
  <text x="735" y="455" font-size="11" font-weight="600" fill="#3A6284">Bioswale Keyline</text>

  <!-- Physical & Microclimate Vectors -->
  <!-- 1. Solar Radiation & Thermal Mass -->
  <path d="M 120 100 L 160 170" stroke="#C07D53" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow-orange)" />
  <text x="70" y="95" font-size="11.5" font-weight="600" fill="#C07D53">Solar Influx (Daytime Absorption)</text>

  <path d="M 265 300 L 320 330" stroke="#C07D53" stroke-width="2" marker-end="url(#arrow-orange)" />
  <text x="270" y="285" font-size="10.5" font-weight="600" fill="#C07D53">Nighttime Thermal Re-radiation</text>

  <!-- 2. Wind Deflection -->
  <path d="M 40 130 C 80 130 110 120 140 80 C 180 30 280 40 380 70" fill="none" stroke="#708090" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="50" y="150" font-size="11.5" font-weight="600" fill="#4F5D6B">Tramuntana Wind Deflection Vector</text>

  <!-- 3. Protected Microclimate Zone -->
  <rect x="270" y="195" width="220" height="40" rx="4" fill="#EDF3E9" stroke="#BACDB3" stroke-width="1" />
  <text x="280" y="212" font-size="11" font-weight="600" fill="#3F5238">Sheltered Ecotone Zone:</text>
  <text x="280" y="227" font-size="10" fill="#576850">-35% Evapotranspiration Rate</text>

  <!-- 4. Subsoil Mycorrhizal Network -->
  <path d="M 600 420 C 580 450 510 440 450 430 M 620 430 C 650 460 720 445 770 435" stroke="#BA8C53" stroke-width="1.8" stroke-dasharray="2,3" />
  <text x="490" y="475" font-size="10.5" font-weight="600" fill="#8C6534">Mycorrhizal Fungal Web (Deep CEC Moisture Exchange)</text>

  <!-- Technical Footer -->
  <text x="40" y="555" font-size="10.5" fill="#8C908E">? S'ESTEPA DESIGN ? ARCHITECTURAL ECOLOGY TECHNICAL SPECIFICATIONS</text>
</svg>