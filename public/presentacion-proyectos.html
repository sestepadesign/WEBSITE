<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos S'Estepa Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0c;
      --bg-card: #141413;
      --text: #f5f3ee;
      --text-muted: #8e8b82;
      --accent: #c49a5b;
      --border: rgba(255, 255, 255, 0.08);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Light Theme (Ideal para impresión y PDF editorial) */
    body.pdf-light {
      --bg: #ffffff;
      --bg-card: #f9f9f8;
      --text: #1a1a18;
      --text-muted: #66635c;
      --border: rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 100;
      background: linear-gradient(180deg, rgba(13, 13, 12, 0.88) 0%, rgba(13, 13, 12, 0) 100%);
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    body.pdf-light .top-bar {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0) 100%);
    }

    .top-bar * {
      pointer-events: auto;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 400;
      color: var(--text);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      height: 38px;
      padding: 0 14px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    body.pdf-light .btn-icon {
      background: rgba(0, 0, 0, 0.04);
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-icon.active-mode {
      background: rgba(196, 154, 91, 0.25);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Presentation Deck */
    .deck-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      cursor: default;
    }

    .deck-container.cursor-prev {
      cursor: w-resize;
    }

    .deck-container.cursor-next {
      cursor: e-resize;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: scale(0.985);
      padding: 72px 48px 56px;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      z-index: 10;
    }

    /* Cover Slide */
    .slide-cover {
      text-align: center;
      background: radial-gradient(circle at center, #1b1a18 0%, #0d0d0c 70%);
    }

    body.pdf-light .slide-cover {
      background: radial-gradient(circle at center, #ffffff 0%, #f4f3f0 70%);
    }

    .cover-content {
      max-width: 800px;
      padding: 40px;
    }

    .cover-tagline {
      font-size: 0.8rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
      font-weight: 300;
    }

    .cover-heading {
      font-family: var(--font-serif);
      font-size: clamp(2.4rem, 5vw, 4.2rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      line-height: 1.15;
      margin-bottom: 24px;
    }

    .cover-sub {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.25rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      font-weight: 300;
    }

    .cover-buttons {
      margin-top: 48px;
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
    }

    .cover-start-hint {
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border: 1px solid rgba(196, 154, 91, 0.4);
      border-radius: 40px;
      transition: all 0.3s ease;
    }

    .cover-start-hint:hover {
      background: rgba(196, 154, 91, 0.18);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Photo Slide */
    .slide-figure {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .slide-header {
      width: 100%;
      max-width: 1400px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .slide-header-left {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .project-name {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 2.5vw, 2.2rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
    }

    .project-order {
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      font-family: var(--font-sans);
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      height: calc(100vh - 165px);
      max-width: 1500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
      background-color: rgba(255, 255, 255, 0.02);
      border-radius: 2px;
      transition: transform 6s ease;
    }

    body.video-playing .slide.active .slide-img {
      transform: scale(1.025);
    }

    body.pdf-light .slide-img {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    /* Bottom Navigation Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 100;
      background: linear-gradient(0deg, rgba(13, 13, 12, 0.88) 0%, rgba(13, 13, 12, 0) 100%);
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    body.pdf-light .bottom-bar {
      background: linear-gradient(0deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0) 100%);
    }

    .bottom-bar * {
      pointer-events: auto;
    }

    .deck-counter {
      font-size: 0.78rem;
      letter-spacing: 0.25em;
      color: var(--text-muted);
    }

    .deck-counter strong {
      color: var(--text);
      font-weight: 400;
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 18px;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 30px;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    body.pdf-light .btn-nav {
      background: rgba(0, 0, 0, 0.03);
    }

    .btn-nav:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* True Fullscreen Mode & Auto-Hide Controls */
    :fullscreen body,
    :-webkit-full-screen body,
    body.is-fullscreen {
      background-color: var(--bg);
    }

    :fullscreen .top-bar,
    :-webkit-full-screen .top-bar,
    body.is-fullscreen .top-bar {
      opacity: 0;
      transform: translateY(-100%);
      pointer-events: none;
    }

    :fullscreen .bottom-bar,
    :-webkit-full-screen .bottom-bar,
    body.is-fullscreen .bottom-bar {
      opacity: 0;
      transform: translateY(100%);
      pointer-events: none;
    }

    :fullscreen.show-controls .top-bar,
    :-webkit-full-screen.show-controls .top-bar,
    body.is-fullscreen.show-controls .top-bar {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    :fullscreen.show-controls .bottom-bar,
    :-webkit-full-screen.show-controls .bottom-bar,
    body.is-fullscreen.show-controls .bottom-bar {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    :fullscreen .image-wrapper,
    :-webkit-full-screen .image-wrapper,
    body.is-fullscreen .image-wrapper {
      height: calc(100vh - 90px);
      max-width: 96vw;
    }

    :fullscreen .slide-img,
    :-webkit-full-screen .slide-img,
    body.is-fullscreen .slide-img {
      max-height: 86vh;
    }

    /* Overview Grid Modal */
    .overview-modal {
      position: fixed;
      inset: 0;
      background: rgba(13, 13, 12, 0.96);
      backdrop-filter: blur(10px);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 32px;
      overflow-y: auto;
    }

    body.pdf-light .overview-modal {
      background: rgba(255, 255, 255, 0.97);
    }

    .overview-modal.open {
      opacity: 1;
      visibility: visible;
    }

    .overview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding-bottom: 40px;
    }

    .overview-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .overview-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
    }

    .overview-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .overview-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #1d1d1b;
    }

    .overview-caption {
      padding: 10px 12px;
      font-family: var(--font-serif);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Print & PDF Export (A4 Landscape 297mm x 210mm) */
    @page {
      size: 297mm 210mm;
      margin: 0;
    }

    @media print {
      @page {
        size: 297mm 210mm;
        margin: 0;
      }

      html, body {
        width: 297mm !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .top-bar, .bottom-bar, .overview-modal, .cover-buttons {
        display: none !important;
      }

      .deck-container {
        position: static !important;
        width: 297mm !important;
        height: auto !important;
        display: block !important;
      }

      .slide {
        position: relative !important;
        opacity: 1 !important;
        visibility: visible !important;
        transform: none !important;
        width: 297mm !important;
        height: 210mm !important;
        max-height: 210mm !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        padding: 12mm 16mm 10mm !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: flex-start !important;
        align-items: center !important;
        overflow: hidden !important;
        box-sizing: border-box !important;
      }

      .slide-cover {
        justify-content: center !important;
      }

      .slide-figure {
        width: 100% !important;
        height: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
      }

      .slide-header {
        width: 100% !important;
        max-width: none !important;
        margin-bottom: 8mm !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: baseline !important;
        border-bottom: 1px solid var(--border) !important;
        padding-bottom: 4mm !important;
      }

      .project-name {
        font-size: 18pt !important;
        line-height: 1.2 !important;
      }

      .project-order {
        font-size: 8pt !important;
      }

      .image-wrapper {
        width: 100% !important;
        height: calc(210mm - 44mm) !important;
        max-height: calc(210mm - 44mm) !important;
        max-width: none !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }

      .slide-img {
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain !important;
        box-shadow: none !important;
      }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .top-bar {
        padding: 0 16px;
      }
      .brand-title {
        font-size: 0.95rem;
      }
      .slide {
        padding: 60px 16px 56px;
      }
      .image-wrapper {
        height: calc(100vh - 140px);
      }
      .bottom-bar {
        padding: 0 16px;
      }
    }
  </style>
</head>

        </svg>

    </div>
  </header>

  <!-- Presentation Deck -->
  <main class="deck-container" id="deckContainer">

    <!-- Cover Slide -->
    <section class="slide slide-cover active" data-index="0" data-title="Portada">
      <div class="cover-content">
        <p class="cover-tagline">Mallorca · Arquitectura del Paisaje</p>
        <h1 class="cover-heading">Proyectos S'Estepa Design</h1>

        <div class="cover-buttons">
          <div class="cover-start-hint" id="startDeck">

  </main>

  <!-- Bottom Navigation Bar -->
  <footer class="bottom-bar">

      <button class="btn-nav" id="btnNext" title="Siguiente (&rarr;)">

  <!-- Overview Grid Modal -->
  <div class="overview-modal" id="overviewModal">
    <div class="overview-header">
      <h2 style="font-family: var(--font-serif); font-size: 1.5rem; letter-spacing: 0.1em; font-weight: 300;">Índice de Proyectos</h2>
      <button class="btn-icon" id="btnCloseOverview" title="Cerrar (Esc)">

        <span>Cerrar</span>

    </div>
    <div class="overview-grid" id="overviewGrid"></div>
  </div>

    // Automatic Path Resolver (Works with file://, localhost, relative folder, and fallback to live site)
    function resolveImgSrc(rawPath) {
      const cleanPath = rawPath.startsWith('/') ? rawPath.slice(1) : rawPath;
      const isFileProtocol = window.location.protocol === 'file:';
      
      if (isFileProtocol) {
        if (window.location.pathname.includes('/codigo/public/')) {
          return cleanPath;
        }
        return 'codigo/public/' + cleanPath;
      }
      return '/' + cleanPath;
    }

    // Setup Fallback for Remote CDN
    function setupFallback(imgElement, rawPath) {
      imgElement.addEventListener('error', function() {
        if (!this.dataset.triedFallback) {
          this.dataset.triedFallback = '1';
          const clean = rawPath.startsWith('/') ? rawPath : '/' + rawPath;
          this.src = clean;
        } else if (this.dataset.triedFallback === '1') {
          this.dataset.triedFallback = '2';
          const clean = rawPath.startsWith('/') ? rawPath : '/' + rawPath;
          this.src = 'https://www.sestepa.com' + encodeURI(clean);
        }
      });
    }

    // Build Slide Deck & Overview Grid
    const deckContainer = document.getElementById('deckContainer');
    const overviewGrid = document.getElementById('overviewGrid');

    galleryItems.forEach((item, index) => {
      const slideIndex = index + 1;

      // 1. Create Slide
      const slide = document.createElement('section');
      slide.className = 'slide';
      slide.dataset.index = slideIndex;
      slide.dataset.title = item.title;

      const figure = document.createElement('div');
      figure.className = 'slide-figure';

      const header = document.createElement('div');
      header.className = 'slide-header';
      header.innerHTML = `
        <div class="slide-header-left">
          <h2 class="project-name">${item.title}</h2>
        </div>
        <span class="project-order">${String(slideIndex).padStart(2, '0')} / ${String(galleryItems.length).padStart(2, '0')}</span>
      `;

      const wrapper = document.createElement('div');
      wrapper.className = 'image-wrapper';

      const img = document.createElement('img');
      img.className = 'slide-img';
      img.alt = item.title;
      img.loading = slideIndex <= 3 ? 'eager' : 'lazy';
      
      const initialSrc = resolveImgSrc(item.path);
      img.src = encodeURI(initialSrc);
      setupFallback(img, item.path);

      wrapper.appendChild(img);
      figure.appendChild(header);
      figure.appendChild(wrapper);
      slide.appendChild(figure);
      deckContainer.appendChild(slide);

      // 2. Create Overview Card
      const card = document.createElement('div');
      card.className = 'overview-card';
      card.dataset.index = slideIndex;

      const thumb = document.createElement('img');
      thumb.className = 'overview-thumb';
      thumb.alt = item.title;
      thumb.loading = 'lazy';
      thumb.src = encodeURI(initialSrc);
      setupFallback(thumb, item.path);

      const cap = document.createElement('div');
      cap.className = 'overview-caption';
      cap.textContent = `${String(slideIndex).padStart(2, '0')}. ${item.title}`;

      card.appendChild(thumb);
      card.appendChild(cap);
      card.addEventListener('click', () => {
        stopAutoPlay();
        goToSlide(slideIndex);
        closeOverview();
      });
      overviewGrid.appendChild(card);
    });

    // Navigation State
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    const currentSlideNum = document.getElementById('currentSlideNum');
    const totalSlidesNum = document.getElementById('totalSlidesNum');
    totalSlidesNum.textContent = totalSlides;

    function goToSlide(index) {
      if (index < 0 || index >= totalSlides) return;
      slides[currentSlide].classList.remove('active');
      currentSlide = index;
      slides[currentSlide].classList.add('active');
      currentSlideNum.textContent = currentSlide + 1;

      // Highlight active in overview
      document.querySelectorAll('.overview-card').forEach(card => {
        card.classList.toggle('active', parseInt(card.dataset.index) === currentSlide);
      });

      // Preload next images
      if (currentSlide + 1 < totalSlides) {
        const nextImg = slides[currentSlide + 1].querySelector('.slide-img');
        if (nextImg && nextImg.loading === 'lazy') nextImg.loading = 'eager';
      }
      if (currentSlide + 2 < totalSlides) {
        const nextImg2 = slides[currentSlide + 2].querySelector('.slide-img');
        if (nextImg2 && nextImg2.loading === 'lazy') nextImg2.loading = 'eager';
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        goToSlide(currentSlide + 1);
      } else {
        goToSlide(0);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        goToSlide(currentSlide - 1);
      } else {
        goToSlide(totalSlides - 1);
      }
    }

    // Auto-Hide Controls & Fullscreen idle management
    let idleTimer = null;
    function showControls() {
      document.body.classList.add('show-controls');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains('is-fullscreen')) {
          document.body.classList.remove('show-controls');
        }
      }, 2500);
    }
    window.addEventListener('mousemove', showControls);
    window.addEventListener('touchstart', showControls, { passive: true });

    // Video Slideshow / PLAY Mode
    let isPlaying = false;
    let autoPlayTimer = null;
    const SLIDE_DURATION = 3800; // 3.8 seconds per photo

    function startAutoPlay() {
      isPlaying = true;
      document.body.classList.add('video-playing');
      document.getElementById('btnAutoPlay').classList.add('active-mode');
      document.getElementById('autoPlayText').textContent = 'PAUSA';
      document.getElementById('playIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
      
      if (currentSlide === 0) {
        nextSlide();
      }

      clearInterval(autoPlayTimer);
      autoPlayTimer = setInterval(nextSlide, SLIDE_DURATION);
    }

    function stopAutoPlay() {
      isPlaying = false;
      document.body.classList.remove('video-playing');
      document.getElementById('btnAutoPlay').classList.remove('active-mode');
      document.getElementById('autoPlayText').textContent = 'PLAY';
      document.getElementById('playIcon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
      clearInterval(autoPlayTimer);
    }

    function toggleAutoPlay() {
      if (isPlaying) stopAutoPlay();
      else startAutoPlay();
    }

    document.getElementById('btnAutoPlay').addEventListener('click', toggleAutoPlay);
    document.getElementById('startVideoDeck').addEventListener('click', () => {
      startAutoPlay();
    });

    // Screen-Half Click Navigation (Signature S'Estepa Slideshow behavior)
    deckContainer.addEventListener('click', (e) => {
      if (currentSlide === 0) return;
      if (overviewModal.classList.contains('open')) return;
      if (e.target.closest('button') || e.target.closest('a') || e.target.closest('.top-bar') || e.target.closest('.bottom-bar') || e.target.closest('.cover-buttons')) {
        return;
      }

      stopAutoPlay();
      const width = window.innerWidth;
      const clickX = e.clientX;
      if (clickX < width / 2) {
        prevSlide();
      } else {
        nextSlide();
      }
      showControls();
    });

    // Dynamic directional cursor indication on hover
    deckContainer.addEventListener('mousemove', (e) => {
      showControls();
      if (currentSlide === 0 || overviewModal.classList.contains('open')) {
        deckContainer.classList.remove('cursor-prev', 'cursor-next');
        return;
      }
      if (e.target.closest('button') || e.target.closest('a') || e.target.closest('.top-bar') || e.target.closest('.bottom-bar') || e.target.closest('.cover-buttons')) {
        deckContainer.classList.remove('cursor-prev', 'cursor-next');
        return;
      }
      const width = window.innerWidth;
      if (e.clientX < width / 2) {
        deckContainer.classList.add('cursor-prev');
        deckContainer.classList.remove('cursor-next');
      } else {
        deckContainer.classList.add('cursor-next');
        deckContainer.classList.remove('cursor-prev');
      }
    });

    // Touch Navigation for Mobile & Tablets (Swipe + Half-Screen Tap)
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
      touchStartTime = Date.now();
      showControls();
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (overviewModal.classList.contains('open')) return;
      if (e.target.closest('button') || e.target.closest('a') || e.target.closest('.top-bar') || e.target.closest('.bottom-bar') || e.target.closest('.cover-buttons')) return;

      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;
      const elapsed = Date.now() - touchStartTime;

      // Horizontal swipe (left = next, right = prev)
      if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
        stopAutoPlay();
        if (diffX < 0) nextSlide();
        else prevSlide();
        return;
      }

      // Tap on left/right half screen
      if (currentSlide > 0 && Math.abs(diffX) < 20 && Math.abs(diffY) < 20 && elapsed < 400) {
        const width = window.innerWidth;
        const tapX = e.changedTouches[0].clientX;
        stopAutoPlay();
        if (tapX < width / 2) {
          prevSlide();
        } else {
          nextSlide();
        }
      }
    }, { passive: true });

    // Navigation Buttons
    document.getElementById('btnNext').addEventListener('click', () => {
      stopAutoPlay();
      nextSlide();
    });
    document.getElementById('btnPrev').addEventListener('click', () => {
      stopAutoPlay();
      prevSlide();
    });
    document.getElementById('startDeck').addEventListener('click', () => {
      stopAutoPlay();
      goToSlide(1);
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (overviewModal.classList.contains('open')) {
        if (e.key === 'Escape') closeOverview();
        return;
      }

      switch (e.key) {
        case 'ArrowRight':
        case 'ArrowDown':
        case 'PageDown':
          e.preventDefault();
          stopAutoPlay();
          nextSlide();
          break;
        case 'ArrowLeft':
        case 'ArrowUp':
        case 'Backspace':
        case 'PageUp':
          e.preventDefault();
          stopAutoPlay();
          prevSlide();
          break;
        case ' ':
          e.preventDefault();
          toggleAutoPlay();
          break;
        case 'Home':
          e.preventDefault();
          stopAutoPlay();
          goToSlide(0);
          break;
        case 'End':
          e.preventDefault();
          stopAutoPlay();
          goToSlide(totalSlides - 1);
          break;
        case 'g':
        case 'G':
          toggleOverview();
          break;
        case 'f':
        case 'F':
          toggleFullscreen();
          break;
        case 'Escape':
          if (document.fullscreenElement || document.webkitFullscreenElement) {
            toggleFullscreen();
          }
          break;
      }
    });

    // Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
        document.body.classList.add('is-fullscreen');
        showControls();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        document.body.classList.remove('is-fullscreen', 'show-controls');
      }
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        document.body.classList.remove('is-fullscreen', 'show-controls');
      } else {
        document.body.classList.add('is-fullscreen');
        showControls();
      }
    });
    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitFullscreenElement) {
        document.body.classList.remove('is-fullscreen', 'show-controls');
      } else {
        document.body.classList.add('is-fullscreen');
        showControls();
      }
    });

    document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);

    // Theme Toggle (Dark Luxury / Clean White for PDF)
    const btnThemeToggle = document.getElementById('btnThemeToggle');
    const themeToggleText = document.getElementById('themeToggleText');
    btnThemeToggle.addEventListener('click', () => {
      document.body.classList.toggle('pdf-light');
      const isLight = document.body.classList.contains('pdf-light');
      themeToggleText.textContent = isLight ? 'Fondo Oscuro' : 'Fondo Claro';
    });

    // Print & PDF Export (Preload all images eagerly before printing)
    window.onbeforeprint = () => {
      stopAutoPlay();
      document.querySelectorAll('.slide-img').forEach(img => {
        img.loading = 'eager';
      });
    };

    document.getElementById('btnPrint').addEventListener('click', () => {
      stopAutoPlay();
      document.querySelectorAll('.slide-img').forEach(img => {
        img.loading = 'eager';
      });
      window.print();
    });

    // Overview Modal
    const overviewModal = document.getElementById('overviewModal');
    function openOverview() {
      stopAutoPlay();
      overviewModal.classList.add('open');
    }
    function closeOverview() {
      overviewModal.classList.remove('open');
    }
    function toggleOverview() {
      if (overviewModal.classList.contains('open')) closeOverview();
      else openOverview();
    }
    document.getElementById('btnOverview').addEventListener('click', toggleOverview);
    document.getElementById('btnCloseOverview').addEventListener('click', closeOverview);
  </script>
